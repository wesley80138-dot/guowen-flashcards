<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>國文 1–3 課 翻卡複習</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF2EC; --card:#FFFFFF; --ink:#1F2A24; --muted:#5E6B63;
  --red:#C8342B; --hl:#F6E36B; --grid:#D9C4C1; --line:#C9D3CB; --ok:#2F7A4F;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#18201B; --card:#222C26; --ink:#E9EEE9; --muted:#9EAAA2;
    --red:#F07468; --hl:#6E5F12; --grid:#5A3F3C; --line:#36433B; --ok:#6FC394;
  }
}
:root[data-theme="dark"]{
  --paper:#18201B; --card:#222C26; --ink:#E9EEE9; --muted:#9EAAA2;
  --red:#F07468; --hl:#6E5F12; --grid:#5A3F3C; --line:#36433B; --ok:#6FC394;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0; min-height:100%; background:var(--paper); color:var(--ink);
  font-family:"LXGW WenKai TC","BiauKai","DFKai-SB","Kaiti TC","PingFang TC","Noto Sans TC",serif; line-height:1.6}
main{max-width:560px; margin:0 auto; padding:16px 16px 40px}
h1{font-size:1.35rem; margin:4px 0 12px}
.tabs{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px}
button{font:inherit; color:var(--ink)}
.tabs button,.ctrl button,.small{border:1.5px solid var(--line); background:var(--card); border-radius:999px; padding:6px 14px; cursor:pointer; font-size:1rem}
.tabs button[aria-pressed="true"]{background:var(--ink); color:var(--card); border-color:var(--ink)}
.status{display:flex; justify-content:space-between; color:var(--muted); font-size:.95rem; margin:6px 2px}
.filter{display:flex; align-items:center; gap:6px; cursor:pointer}
.scene{perspective:1200px; margin:6px 0 14px}
.flip{position:relative; width:100%; aspect-ratio:4/3.4; transition:transform .5s; transform-style:preserve-3d; cursor:pointer}
.flip.on{transform:rotateY(180deg)}
.face{transition:visibility 0s .25s}
.flip.on .front{visibility:hidden}
.flip:not(.on) .back{visibility:hidden}
@media (prefers-reduced-motion: reduce){.flip,.face{transition:none}}
.face{position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; background:var(--card);
  border-radius:18px; border:1.5px solid var(--line); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; overflow:auto}
.tag{position:absolute; top:12px; left:16px; color:var(--red); font-size:.95rem}
.editBtn{position:absolute; top:8px; right:10px; border:1.5px solid var(--line); background:var(--card); border-radius:999px; padding:2px 12px; font-size:.9rem; cursor:pointer}
.word{display:flex; gap:6px; flex-wrap:wrap; justify-content:center}
.cell{width:clamp(64px,19vw,96px); aspect-ratio:1; border:2px solid var(--red); position:relative; display:flex; align-items:center; justify-content:center; font-size:clamp(42px,13vw,66px)}
.cell::before{content:""; position:absolute; left:50%; top:0; bottom:0; border-left:1.5px dashed var(--grid)}
.cell::after{content:""; position:absolute; top:50%; left:0; right:0; border-top:1.5px dashed var(--grid)}
.cell span{position:relative; z-index:1}
.word.long .cell{width:clamp(46px,13vw,68px); font-size:clamp(28px,9vw,46px)}
.hint{position:absolute; bottom:12px; color:var(--muted); font-size:.9rem}
.back{transform:rotateY(180deg); align-items:flex-start; justify-content:flex-start; padding-top:44px}
.back h2{margin:0 0 4px; font-size:1.7rem}
.zy{display:inline-block; background:var(--hl); padding:0 8px; border-radius:4px; font-size:1.2rem; margin-bottom:10px}
.mean{font-size:1.15rem; margin:0 0 10px}
.extra{font-size:1.02rem; border-top:1.5px dashed var(--line); padding-top:8px; width:100%; white-space:pre-line}
.ctrl{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px}
.ctrl button{border-radius:12px; padding:10px 6px}
.ctrl .know{border-color:var(--ok); color:var(--ok)}
.ctrl .dunno{border-color:var(--red); color:var(--red)}
.row2{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap}
.empty{text-align:center; color:var(--muted)}
details{margin-top:18px; background:var(--card); border:1.5px solid var(--line); border-radius:14px; padding:10px 14px}
summary{cursor:pointer; font-size:1.05rem}
.list{margin-top:8px}
.list div{display:flex; justify-content:space-between; align-items:center; gap:8px; padding:6px 0; border-bottom:1px dashed var(--line)}
.list .w{flex:1}
.list .w small{color:var(--muted)}
.list button{background:none; border:none; color:var(--red); cursor:pointer; padding:4px 6px}
dialog{border:none; border-radius:16px; padding:0; width:min(520px,94vw); background:var(--card); color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.4)}
form{display:grid; gap:8px; padding:16px}
form h3{margin:0}
label{font-size:.95rem; color:var(--muted)}
input,textarea,select{font:inherit; width:100%; padding:8px 10px; border-radius:8px; border:1.5px solid var(--line); background:var(--paper); color:var(--ink)}
textarea{min-height:70px}
.btns{display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end}
.btns .danger{color:var(--red); border-color:var(--red)}
.btns .primary{background:var(--ink); color:var(--card); border-color:var(--ink)}
button:focus-visible,.flip:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--red); outline-offset:2px}
</style>
</head>
<body>
<main>
  <h1>國文第 1–3 課・翻卡複習</h1>
  <div class="tabs" id="tabs"></div>
  <div class="status">
    <span id="count"></span>
    <label class="filter"><input type="checkbox" id="onlyWeak" style="width:auto"> 只看不熟的</label>
  </div>
  <div id="stage"></div>
  <div class="ctrl">
    <button id="prev">← 上一張</button>
    <button id="flipBtn">翻面</button>
    <button id="next">下一張 →</button>
  </div>
  <div class="ctrl" style="margin-top:8px">
    <button class="dunno" id="dunno">✗ 不熟</button>
    <button id="shuffle">洗牌</button>
    <button class="know" id="know">✓ 會了</button>
  </div>
  <div class="row2">
    <button class="small" id="addBtn">＋ 新增卡片</button>
    <button class="small" id="resetMarks">清除會了／不熟紀錄</button>
  </div>

  <details>
    <summary>卡片清單（檢查、修改辨識錯誤）</summary>
    <div class="list" id="list"></div>
    <div class="row2"><button class="small" id="restoreAll">全部還原成原始內容</button><button class="small" id="exportBtn">匯出我的修改</button></div>
    <textarea id="exportBox" readonly style="display:none;margin-top:8px;min-height:120px;font-size:.8rem"></textarea>
    <p id="exportHint" style="display:none;color:var(--muted);font-size:.9rem;margin:6px 0 0">全選上面的文字、複製，貼給 Claude，就能把修改直接寫進分享版。</p>
  </details>
</main>

<dialog id="dlg">
  <form id="editForm" method="dialog">
    <h3 id="dlgTitle">修改卡片</h3>
    <div><label for="fLesson">課次</label>
      <select id="fLesson"><option value="1">第 1 課</option><option value="2">第 2 課</option><option value="3">第 3 課</option></select></div>
    <div><label for="fWord">詞語（正面）</label><input id="fWord" required></div>
    <div><label for="fZy">注音</label><input id="fZy"></div>
    <div><label for="fMean">註釋</label><textarea id="fMean" required></textarea></div>
    <div><label for="fExtra">補充（筆記、近義、反義、易混字，可換行）</label><textarea id="fExtra"></textarea></div>
    <div class="btns">
      <button type="button" class="small danger" id="delBtn">刪除這張</button>
      <button type="button" class="small" id="revertBtn">還原原始</button>
      <button type="button" class="small" id="cancelBtn">取消</button>
      <button type="submit" class="small primary">儲存</button>
    </div>
  </form>
</dialog>

<script>
const BASE = [
  // 第 1 課
  {id:"1-02",lesson:1,word:"滂沱",zy:"ㄆㄤ ㄊㄨㄛˊ",mean:"雨勢盛大的樣子。",extra:""},
  {id:"1-03",lesson:1,word:"霹靂環起",zy:"ㄆㄧ ㄌㄧˋ ㄏㄨㄢˊ ㄑㄧˇ",mean:"急而響的雷聲四處響起。霹靂：急而響的雷聲。",extra:"霹、靂都是「雨」部"},
  {id:"1-04",lesson:1,word:"霎時間",zy:"ㄕㄚˋ ㄕˊ ㄐㄧㄢ",mean:"極短的時間。霎：短暫的。",extra:"近義：剎那、頃刻、瞬時、俄頃、倏忽、彈指、眨眼\n反義：亙古"},
  {id:"1-05",lesson:1,word:"攫",zy:"ㄐㄩㄝˊ",mean:"用爪抓取。",extra:""},
  {id:"1-06",lesson:1,word:"孤伶伶",zy:"ㄍㄨ ㄌㄧㄥˊ ㄌㄧㄥˊ",mean:"孤單的樣子。亦作「孤零零」。",extra:""},
  {id:"1-08",lesson:1,word:"震懾",zy:"ㄓㄣˋ ㄓㄜˊ",mean:"震驚恐懼。懾：恐懼。",extra:"易混：懾（恐懼）≠ 攝（攝取、攝影）"},
  {id:"1-09",lesson:1,word:"氣餒萎頓",zy:"ㄑㄧˋ ㄋㄟˇ ㄨㄟˇ ㄉㄨㄣˋ",mean:"失神無力，疲乏困頓。",extra:""},
  {id:"1-10",lesson:1,word:"匍匐",zy:"ㄆㄨˊ ㄈㄨˊ",mean:"伏地爬行。",extra:""},
  {id:"1-11",lesson:1,word:"肆虐",zy:"ㄙˋ ㄋㄩㄝˋ",mean:"任意作惡為害。肆：放縱、任意。",extra:"相關：放肆、肆無忌憚\n虐：部首「虍」"},
  {id:"1-12",lesson:1,word:"蘇醒",zy:"ㄙㄨ ㄒㄧㄥˇ",mean:"清醒過來。亦作「甦醒」。",extra:""},
  {id:"1-13",lesson:1,word:"氣勢萬鈞",zy:"ㄑㄧˋ ㄕˋ ㄨㄢˋ ㄐㄩㄣ",mean:"形容氣勢雄偉壯盛。鈞：古代的重量單位，三十斤為一鈞。",extra:"近義：雷霆萬鈞、磅礴\n相關：千鈞一髮（危險）\n反義：氣若游絲、奄奄一息"},
  {id:"1-14",lesson:1,word:"逞",zy:"ㄔㄥˇ",mean:"顯露、展示。",extra:"例：逞強、逞威風"},
  {id:"1-15",lesson:1,word:"劈殺",zy:"ㄆㄧ ㄕㄚ",mean:"砍殺。",extra:"例：天打雷劈、劈頭（朝著）"},
  {id:"1-16",lesson:1,word:"行潦",zy:"ㄒㄧㄥˊ ㄌㄠˇ",mean:"因下雨而匯流於道旁的流水。潦：積水。",extra:"形近字：燎、撩、瞭"},
  {id:"1-17",lesson:1,word:"登時",zy:"ㄉㄥ ㄕˊ",mean:"立刻。",extra:"近義：立即、馬上"},
  {id:"1-18",lesson:1,word:"笠",zy:"ㄌㄧˋ",mean:"用竹片編成的帽子。",extra:""},
  {id:"1-19",lesson:1,word:"簑衣",zy:"ㄙㄨㄛ ㄧ",mean:"用草或棕葉編成的雨衣。",extra:""},
  // 第 2 課
  {id:"2-01",lesson:2,word:"迢迢",zy:"ㄊㄧㄠˊ ㄊㄧㄠˊ",mean:"遙遠的樣子。",extra:"疊字（形容詞）"},
  {id:"2-03",lesson:2,word:"皎皎",zy:"ㄐㄧㄠˇ ㄐㄧㄠˇ",mean:"明亮的樣子。",extra:"相關：皎潔\n皚皚、皓、皤（ㄆㄛˊ）都有「白」的意思"},
  {id:"2-05",lesson:2,word:"纖纖",zy:"ㄒㄧㄢ ㄒㄧㄢ",mean:"細長柔美的樣子。",extra:"疊字（形容詞）；纖細"},
  {id:"2-06",lesson:2,word:"擢素手",zy:"ㄓㄨㄛˊ ㄙㄨˋ ㄕㄡˇ",mean:"舉起白嫩的手。擢：舉起。",extra:"拔擢：提拔人才\n洗濯（ㄓㄨㄛˊ）：洗"},
  {id:"2-07",lesson:2,word:"札札",zy:"ㄓㄚˊ ㄓㄚˊ",mean:"此指織布的聲音。",extra:"狀聲詞"},
  {id:"2-08",lesson:2,word:"機杼",zy:"ㄐㄧ ㄓㄨˋ",mean:"指織布機。杼：織布機的梭子。",extra:"自出機杼＝別出心裁\n反義：拾人牙慧"},
  {id:"2-09",lesson:2,word:"終日",zy:"ㄓㄨㄥ ㄖˋ",mean:"整天。",extra:"近義：鎮日"},
  {id:"2-10",lesson:2,word:"成章",zy:"ㄔㄥˊ ㄓㄤ",mean:"織成布匹。章：織品上縱橫交錯的紋理。",extra:"匹：ㄆㄧ\n相關：出口成章（文思泉湧）"},
  {id:"2-11",lesson:2,word:"泣涕零如雨",zy:"ㄑㄧˋ ㄊㄧˋ ㄌㄧㄥˊ ㄖㄨˊ ㄩˇ",mean:"眼淚如雨般落下。零：落。",extra:"古代「涕」指眼淚，「泗」指鼻涕"},
  {id:"2-12",lesson:2,word:"去",zy:"ㄑㄩˋ",mean:"距離。",extra:""},
  {id:"2-13",lesson:2,word:"復幾許",zy:"ㄈㄨˋ ㄐㄧˇ ㄒㄩˇ",mean:"又有多少呢？",extra:""},
  {id:"2-14",lesson:2,word:"盈盈",zy:"ㄧㄥˊ ㄧㄥˊ",mean:"水清淺的樣子。",extra:"盈：滿溢、豐盈"},
  {id:"2-15",lesson:2,word:"脈脈",zy:"ㄇㄛˋ ㄇㄛˋ",mean:"含情凝視的樣子。",extra:""},
  {id:"2-21",lesson:2,word:"啞啞",zy:"ㄧㄚ ㄧㄚ",mean:"形容烏鴉的叫聲。",extra:"沙啞的啞念ㄧㄚˇ"},
  {id:"2-22",lesson:2,word:"經年",zy:"ㄐㄧㄥ ㄋㄧㄢˊ",mean:"形容時間長久。",extra:""},
  {id:"2-23",lesson:2,word:"沾襟",zy:"ㄓㄢ ㄐㄧㄣ",mean:"眼淚沾溼衣襟。襟：上衣胸前交疊的部分。",extra:"正襟危坐（嚴肅）\n捉襟見肘（ㄓㄡˇ）"},
  {id:"2-24",lesson:2,word:"反哺",zy:"ㄈㄢˇ ㄅㄨˇ",mean:"報答父母的恩情。",extra:"烏鴉反哺、羊羔跪乳（孝順）\n相關：哺乳、嗷嗷待哺、吐哺握髮\n形近：埔、圃"},
  {id:"2-25",lesson:2,word:"爾",zy:"ㄦˇ",mean:"你。",extra:"同義：汝、乃、若"},
  {id:"2-26",lesson:2,word:"任",zy:"ㄖㄣˊ",mean:"承受。",extra:""},
  {id:"2-27",lesson:2,word:"母歿喪不臨",zy:"ㄇㄨˇ ㄇㄛˋ ㄙㄤ ㄅㄨˋ ㄌㄧㄣˊ",mean:"母親去世卻不回家奔喪。歿：去世。喪不臨，即「不臨喪」，不去奔喪的意思。",extra:"倒裝句\n歿：逝世、過世、往生、撒手人寰"},
  {id:"2-28",lesson:2,word:"嗟哉",zy:"ㄐㄧㄝ ㄗㄞ",mean:"嘆詞。",extra:"相關：嗚呼哀哉"},
  {id:"2-29",lesson:2,word:"斯徒輩",zy:"ㄙ ㄊㄨˊ ㄅㄟˋ",mean:"這一類的人。斯：此、這。徒、輩都是「類」的意思。",extra:"徒＝輩＝類＝倫\n斯＝此＝茲（念茲在茲）"},
  {id:"2-30",lesson:2,word:"復",zy:"ㄈㄨˋ",mean:"助詞，無義。",extra:""},
  // 第 3 課
  {id:"3-01",lesson:3,word:"魂牽夢縈",zy:"ㄏㄨㄣˊ ㄑㄧㄢ ㄇㄥˋ ㄧㄥˊ",mean:"形容極為思念，連夢中都無法忘懷。縈：旋繞。",extra:"相關：日有所思，夜有所夢"},
  {id:"3-02",lesson:3,word:"長工",zy:"ㄔㄤˊ ㄍㄨㄥ",mean:"長期僱用的工人。",extra:""},
  {id:"3-03",lesson:3,word:"熹微",zy:"ㄒㄧ ㄨㄟˊ",mean:"陽光微弱的樣子。熹：明亮。",extra:"相關：晨光、黎明、拂曉、破曉"},
  {id:"3-04",lesson:3,word:"啟蒙",zy:"ㄑㄧˇ ㄇㄥˊ",mean:"開導、啟發。蒙：無知、不懂事理。",extra:""},
  {id:"3-06",lesson:3,word:"布姑娘",zy:"ㄅㄨˋ ㄍㄨ ㄋㄧㄤˊ",mean:"布做的人形玩偶。",extra:"相關：絨毛、毛茸茸（ㄖㄨㄥˊ）"},
  {id:"3-07",lesson:3,word:"吱嗒",zy:"ㄓ ㄉㄚ",mean:"形容在泥地中踩水所發出的聲響。",extra:"狀聲詞\n易混：輕脆（聲音）≠ 青翠（顏色）"},
  {id:"3-08",lesson:3,word:"黃梅天",zy:"ㄏㄨㄤˊ ㄇㄟˊ ㄊㄧㄢ",mean:"此時梅子變黃成熟。",extra:"又稱梅雨季"},
  {id:"3-11",lesson:3,word:"亮晃晃",zy:"ㄌㄧㄤˋ ㄏㄨㄤˇ ㄏㄨㄤˇ",mean:"明亮閃爍的樣子。",extra:"晃動的晃念ㄏㄨㄤˋ"},
  {id:"3-16",lesson:3,word:"幽幽",zy:"ㄧㄡ ㄧㄡ",mean:"形容聲音輕微。",extra:"幽：①深遠、安靜（幽遠、幽靜、清幽）②不公開的（幽會）③昏暗（幽暗）"}
];

const store = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};
let custom = store.get("fc2_custom", []);
let edits  = store.get("fc2_edits", {});
let hidden = store.get("fc2_hidden", []);
let marks  = store.get("fc2_marks", {});
let lesson = "all", onlyWeak = false, order = [], idx = 0, flipped = false, editingId = null;

function all(){
  return BASE.filter(c=>!hidden.includes(c.id)).map(c=>edits[c.id]?Object.assign({},c,edits[c.id]):c).concat(custom);
}
const byId = id => all().find(c=>c.id===id);
function deck(){
  let d = all().filter(c => lesson==="all" || String(c.lesson)===lesson);
  if(onlyWeak) d = d.filter(c => marks[c.id]==="weak");
  return d;
}
function rebuild(keep){
  const d = deck(), ids = d.map(c=>c.id);
  order = keep ? order.filter(id=>ids.includes(id)).concat(ids.filter(id=>!order.includes(id))) : ids;
  if(idx >= order.length) idx = 0;
  flipped = false; render(); renderTabs(); renderList();
}
const esc = s => String(s??"").replace(/[&<>"]/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));

function renderTabs(){
  const t = document.getElementById("tabs"); t.innerHTML = "";
  [["all","全部"],["1","第 1 課"],["2","第 2 課"],["3","第 3 課"]].forEach(([v,l])=>{
    const n = all().filter(c=>v==="all"||String(c.lesson)===v).length;
    const b = document.createElement("button");
    b.textContent = `${l}（${n}）`; b.setAttribute("aria-pressed", lesson===v);
    b.onclick = ()=>{ lesson=v; idx=0; rebuild(); };
    t.appendChild(b);
  });
}
function render(){
  const stage = document.getElementById("stage");
  const done = order.filter(id=>marks[id]==="know").length;
  document.getElementById("count").textContent = order.length ? `第 ${idx+1} / ${order.length} 張　已會 ${done}` : "";
  if(!order.length){
    stage.innerHTML = `<div class="scene"><div class="face empty" style="position:relative;aspect-ratio:4/3.4">${onlyWeak?"這一組沒有「不熟」的卡片了 🎉":"這一課還沒有卡片，點「新增卡片」加進來。"}</div></div>`;
    return;
  }
  const c = byId(order[idx]); const chars=[...c.word];
  const mark = marks[c.id]==="know"?"✓ 會了":marks[c.id]==="weak"?"✗ 不熟":"";
  stage.innerHTML = `<div class="scene"><div class="flip ${flipped?"on":""}" id="card" tabindex="0" role="button" aria-label="點一下翻面">
    <div class="face front"><span class="tag">第 ${c.lesson} 課　${mark}</span>
      <div class="word ${chars.length>3?"long":""}">${chars.map(ch=>`<div class="cell"><span>${esc(ch)}</span></div>`).join("")}</div>
      <span class="hint">點卡片翻面（空白鍵也可以）</span></div>
    <div class="face back"><span class="tag">第 ${c.lesson} 課</span>
      <button class="editBtn" id="editHere">修改</button>
      <h2>${esc(c.word)}</h2>${c.zy?`<span class="zy">${esc(c.zy)}</span>`:""}
      <p class="mean">${esc(c.mean)}</p>${c.extra?`<div class="extra">${esc(c.extra)}</div>`:""}</div>
  </div></div>`;
  document.getElementById("card").onclick = toggle;
  document.getElementById("editHere").onclick = e=>{ e.stopPropagation(); openEdit(c.id); };
}
function renderList(){
  const l = document.getElementById("list"); l.innerHTML = "";
  deck().forEach(c=>{
    const row=document.createElement("div");
    const changed = edits[c.id] || c.id.startsWith("u");
    row.innerHTML=`<span class="w">${esc(c.word)} <small>第${c.lesson}課${changed?"・已修改":""}</small></span>`;
    const b=document.createElement("button"); b.textContent="修改"; b.onclick=()=>openEdit(c.id);
    row.appendChild(b); l.appendChild(row);
  });
}
function toggle(){ flipped=!flipped; const el=document.getElementById("card"); if(el) el.classList.toggle("on",flipped); }
function go(d){ if(!order.length) return; idx=(idx+d+order.length)%order.length; flipped=false; render(); }
function markCard(v){ if(!order.length) return; marks[order[idx]]=v; store.set("fc2_marks",marks);
  if(onlyWeak && v==="know") rebuild(true); else go(1); }

const dlg = document.getElementById("dlg");
const F = id => document.getElementById(id);
function openEdit(id){
  editingId = id;
  const c = id ? byId(id) : {lesson: lesson==="all"?1:+lesson, word:"", zy:"", mean:"", extra:""};
  F("dlgTitle").textContent = id ? "修改卡片" : "新增卡片";
  F("fLesson").value=String(c.lesson); F("fWord").value=c.word; F("fZy").value=c.zy||""; F("fMean").value=c.mean; F("fExtra").value=c.extra||"";
  F("revertBtn").style.display = (id && edits[id]) ? "" : "none";
  F("delBtn").style.display = id ? "" : "none";
  dlg.showModal();
}
F("editForm").onsubmit = e=>{
  e.preventDefault();
  const v = {lesson:+F("fLesson").value, word:F("fWord").value.trim(), zy:F("fZy").value.trim(), mean:F("fMean").value.trim(), extra:F("fExtra").value.trim()};
  if(!v.word||!v.mean) return;
  if(!editingId){ custom.push(Object.assign({id:"u"+Date.now()},v)); store.set("fc2_custom",custom); }
  else if(editingId.startsWith("u")){ custom=custom.map(c=>c.id===editingId?Object.assign({},c,v):c); store.set("fc2_custom",custom); }
  else { edits[editingId]=v; store.set("fc2_edits",edits); }
  dlg.close(); rebuild(true);
};
F("cancelBtn").onclick=()=>dlg.close();
F("revertBtn").onclick=()=>{ delete edits[editingId]; store.set("fc2_edits",edits); dlg.close(); rebuild(true); };
F("delBtn").onclick=()=>{
  if(!confirm("刪除這張卡片？")) return;
  if(editingId.startsWith("u")){ custom=custom.filter(c=>c.id!==editingId); store.set("fc2_custom",custom); }
  else { hidden.push(editingId); store.set("fc2_hidden",hidden); }
  dlg.close(); rebuild(true);
};
F("restoreAll").onclick=()=>{ if(confirm("把所有修改和刪除還原成原始內容？（自己新增的卡片會保留）")){ edits={}; hidden=[]; store.set("fc2_edits",edits); store.set("fc2_hidden",hidden); rebuild(); } };
F("addBtn").onclick=()=>openEdit(null);
F("exportBtn").onclick=()=>{
  const box=F("exportBox");
  const n=Object.keys(edits).length+hidden.length+custom.length;
  box.value = n ? JSON.stringify({edits,hidden,custom}) : "目前沒有任何修改。";
  box.style.display=""; F("exportHint").style.display = n?"":"none";
  box.focus(); box.select();
};
F("prev").onclick=()=>go(-1); F("next").onclick=()=>go(1); F("flipBtn").onclick=toggle;
F("know").onclick=()=>markCard("know"); F("dunno").onclick=()=>markCard("weak");
F("shuffle").onclick=()=>{ for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];} idx=0; flipped=false; render(); };
F("resetMarks").onclick=()=>{ if(confirm("清除所有「會了／不熟」紀錄？")){ marks={}; store.set("fc2_marks",marks); rebuild(); } };
F("onlyWeak").onchange=e=>{ onlyWeak=e.target.checked; idx=0; rebuild(); };
document.addEventListener("keydown",e=>{
  if(dlg.open || ["INPUT","TEXTAREA","SELECT"].includes(e.target.tagName)) return;
  if(e.key===" "){ e.preventDefault(); toggle(); }
  if(e.key==="ArrowRight") go(1);
  if(e.key==="ArrowLeft") go(-1);
});
rebuild();
</script>
</body>
</html>
